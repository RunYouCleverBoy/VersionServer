[project]
name = "version-server"
version = "1.0.0"
description = "HTTP service for publishing and downloading versioned project files."
readme = "docs/API.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115.6",
    "markdown>=3.7",
    "pyjks>=20.0.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
version-server = "versionserver.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versionserver"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The HMAC key is:jwt.warnings.InsecureKeyLengthWarning",
]
